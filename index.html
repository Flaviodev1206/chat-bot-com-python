<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolo Bot</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; background: #f9f9f9; }
        #chat { height: 300px; overflow-y: auto; border: 1px solid #ccc; background: #fff; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .msg { margin: 5px 0; padding: 8px; border-radius: 5px; }
        .user { background: #e3f2fd; text-align: right; }
        .bot { background: #ffe0b2; text-align: left; }
        #input { display: flex; gap: 5px; }
        input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #ff9800; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #e68900; }
    </style>
</head>
<body>
    <h2>🍰 Loja de Bolos</h2>
    <div id="chat"></div>
    <div id="input">
        <input type="text" id="msg" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter') enviar()">
        <button onclick="enviar()">Enviar</button>
    </div>
    <script>
        async function enviar() {
            const input = document.getElementById('msg');
            const msg = input.value;
            if (!msg.trim()) return;
            
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg user">Você: ${msg}</div>`;
            input.value = '';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem: msg, cliente_id: 'web' })
                });
                const data = await res.json();
                chat.innerHTML += `<div class="msg bot">Bot: ${data.resposta}</div>`;
                chat.scrollTop = chat.scrollHeight;
            } catch (e) {
                chat.innerHTML += `<div class="msg bot" style="background:#ffcdd2">Erro ao conectar</div>`;
            }
        }
    </script>
</body>
</html>
